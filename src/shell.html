<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1422"><meta name="apple-mobile-web-app-title" content="Noah Coloring"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><title>/*TITLE*/</title>
<style>
:root{--k:1;--sal:0px;--sar:0px;--sat:0px;--sab:0px;--il:max(env(safe-area-inset-left),var(--sal));--ir:max(env(safe-area-inset-right),var(--sar));--it:max(env(safe-area-inset-top),var(--sat));--ib:max(env(safe-area-inset-bottom),var(--sab))}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;position:fixed;top:0;right:0;bottom:0;left:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#1a1422;overflow:hidden;touch-action:none;font-family:"Trebuchet MS",Verdana,sans-serif;color:#2b1a10}
#c{position:absolute;left:0;top:0;width:100%;height:100%}
#ui{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:4}
.btn{pointer-events:auto;position:absolute;min-width:44px;min-height:44px;padding:8px 20px;border:2px solid #3a1d08;border-radius:16px;color:#4a2508;font:900 18px "Trebuchet MS",Verdana,sans-serif;letter-spacing:.5px;touch-action:manipulation;cursor:pointer;white-space:nowrap;
 background:linear-gradient(#fff3b0 0%,#ffd451 22%,#f0a51f 70%,#c9761a 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -3px 0 rgba(120,50,0,.35),0 4px 0 #6b3510,0 6px 10px rgba(0,0,0,.45);text-shadow:0 1px 0 rgba(255,255,255,.6);transition:transform .08s}
.btn:active{transform:translateY(3px) scale(.97);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 #6b3510,0 2px 4px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(#e6ffb8 0%,#8fe05a 25%,#3fa83a 72%,#2a7d2c 100%);color:#fff;text-shadow:0 2px 0 #1d5a1e,0 0 2px #1d5a1e;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,60,0,.35),0 4px 0 #1f4f16,0 6px 10px rgba(0,0,0,.45);border-color:#163d10}
.btn.big{font-size:28px;padding:10px 46px;border-radius:22px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
.btn.cream,.btn.blue,.btn.red{background:linear-gradient(#c98a4e 0%,#9a5a2a 45%,#7a4220 100%);color:#ffe9a8;text-shadow:0 2px 0 #3a1d08;border-color:#2e1606;box-shadow:inset 0 2px 0 rgba(255,220,160,.55),inset 0 0 0 2px rgba(255,200,90,.35),0 4px 0 #2e1606,0 6px 10px rgba(0,0,0,.45)}
.btn.wood{background:linear-gradient(#c98a4e 0%,#9a5a2a 45%,#7a4220 100%);color:#ffd84a;text-shadow:0 2px 0 #3a1d08,0 0 6px rgba(255,190,60,.5);border:3px solid #e8b84a;box-shadow:inset 0 2px 0 rgba(255,220,160,.55),inset 0 0 0 2px rgba(255,200,90,.45),0 0 0 2px #2e1606,0 5px 0 #2e1606,0 8px 14px rgba(0,0,0,.5)}
.btn .st{font-size:10px;color:#ffd34d;line-height:1;letter-spacing:1px;text-shadow:0 1px 0 #3a1d08}
.btn.lock{background:linear-gradient(#8f8578,#655d53);color:#cfc6b8;text-shadow:none;border-color:#3a342e}
.logo{font:900 min(calc(46px*var(--k)),5.6vw) "Trebuchet MS",Verdana,sans-serif;letter-spacing:1px;color:#ffd34d;background:linear-gradient(#fffbe0 10%,#ffd84a 45%,#f39a1c 80%,#c8620e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 0 0 #3a1d08) drop-shadow(2px 0 0 #3a1d08) drop-shadow(-2px 0 0 #3a1d08) drop-shadow(0 -2px 0 #3a1d08) drop-shadow(0 4px 0 #3a1d08) drop-shadow(0 8px 10px rgba(0,0,0,.5));animation:logo 2.6s ease-in-out infinite}
@keyframes logo{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
.tag{display:inline-block;margin-top:6px;font:900 calc(14px*var(--k)) "Trebuchet MS",Verdana,sans-serif;color:#ffe9a8;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(#7a4220,#4e2810);border:2px solid #c9922e;border-radius:20px;padding:4px 16px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
#load{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(#4e2810,#1a0d04);color:#ffd34d;font:900 22px "Trebuchet MS",Verdana,sans-serif;letter-spacing:2px}
#top{position:fixed;top:calc(var(--it) + 6px);left:calc(var(--il) + 6px);right:calc(var(--ir) + 6px);min-height:46px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:6}
#top>*+*{margin-left:6px}#top span>*+*{margin-left:6px}#mid>*+*{margin-top:4px}
#top .btn{position:static;min-width:44px;width:44px;height:44px;padding:0;font-size:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#hud{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:linear-gradient(#7a4220,#4e2810);border:2px solid #d9a441;border-radius:14px;padding:6px 14px;font-weight:900;font-size:16px;color:#fff;text-shadow:0 2px 0 #2e1606;display:none;box-shadow:inset 0 1px 0 rgba(255,220,150,.5),0 3px 0 #2e1606,0 4px 10px rgba(0,0,0,.4)}
#hud .lt{color:#ffd34d;margin-right:8px}
#cap{position:static;max-width:100%;background:linear-gradient(#fff9e6,#f3dfae);border:2px solid #8a5a22;outline:2px solid #3a1d08;border-radius:14px;padding:3px 12px;font-weight:bold;font-size:13px;color:#3a1d08;text-align:center;display:none;z-index:5;box-shadow:inset 0 0 12px rgba(160,100,30,.35),0 5px 12px rgba(0,0,0,.45);line-height:1.3;pointer-events:none}
#cap small{display:block;font-size:11px;color:#7a4a12;margin-top:3px}
#card{position:fixed;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:radial-gradient(rgba(40,20,5,.35),rgba(10,5,0,.75));z-index:7;padding:calc(var(--it) + 8px) calc(var(--ir) + 8px) calc(var(--ib) + 8px) calc(var(--il) + 8px);pointer-events:auto}
#card.on{display:flex}
#card .in{position:relative;width:min(580px,100%);max-height:100%;overflow:auto;background:radial-gradient(ellipse at 50% 40%,#fffaf0 0%,#f7e6bb 70%,#e8cf95 100%);border:7px solid transparent;border-radius:22px;background-clip:padding-box;box-shadow:0 0 0 3px #3a1d08,0 0 0 9px #a8652e,0 0 0 11px #f2c14e,0 0 0 13px #3a1d08,0 14px 30px rgba(0,0,0,.6),inset 0 0 24px rgba(160,100,30,.4);margin:14px;padding:10px 22px 14px;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#card h2{margin:0;font:900 24px "Trebuchet MS",Verdana,sans-serif;color:#ffd34d;-webkit-text-stroke:1px #3a1d08;text-shadow:0 2px 0 #3a1d08,0 3px 6px rgba(0,0,0,.4);letter-spacing:.5px}
#card .stars{font-size:32px;letter-spacing:8px;margin:0;color:#ffcc2a;text-shadow:0 2px 0 #7a4220,0 0 10px rgba(255,200,40,.8)}
#card .stars i{font-style:normal;display:inline-block;animation:pop .4s backwards}
#card .stars i.off{color:#cbbfa8;text-shadow:none}
#card .v{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:17px;line-height:1.35;margin:6px 0 2px;color:#2b1a10}
#card .ref{font-weight:bold;color:#7a4a12;font-size:15px;margin-bottom:10px}
#card .ver{font-size:11px;color:#8a7a62;letter-spacing:1px}
#card .credit{font-size:9px;line-height:1.25;color:#8a7a62;margin:8px auto 0;max-width:440px}
#card .row>*+*{margin-left:12px}
#card .row{display:flex;justify-content:center}
#card .btn{position:static}
#fade{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;opacity:1;z-index:8;pointer-events:auto;transition:opacity .5s ease}
#rotate{position:fixed;top:0;right:0;bottom:0;left:0;background:#2a3a5a;color:#fff;display:none;z-index:30;flex-direction:column;align-items:center;justify-content:center;font-size:26px;text-align:center;padding:20px;font-weight:bold}
#rotate.on{display:flex}#rotate .ph{width:70px;height:116px;border:7px solid #fff;border-radius:14px;margin:20px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate .sub{font-size:17px;opacity:.85;margin-top:10px;font-weight:normal}
#err{position:fixed;left:8px;right:8px;bottom:8px;background:#fff3f0;color:#8a1f11;border:3px solid #8a1f11;border-radius:10px;padding:8px 12px;font:14px monospace;z-index:40;display:none;max-height:30%;overflow:auto;pointer-events:auto}
@media (max-height:340px){#card .v{font-size:15px}#card h2{font-size:19px}}
.kidrib{position:absolute;left:calc(var(--il) + 3%);top:calc(var(--it) + 4%);transform:rotate(-6deg);pointer-events:none;font:900 calc(15px*var(--k)) "Trebuchet MS",Verdana,sans-serif;letter-spacing:1px;color:#4a2508;background:linear-gradient(#fffbe0,#ffd84a 60%,#f3a42c);border:2px solid #7a4220;border-radius:6px;padding:5px 16px;box-shadow:0 3px 0 #3a1d08,0 6px 14px rgba(0,0,0,.45);animation:kidrib 3s ease-in-out infinite}
@keyframes kidrib{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-3px)}}

#ca{position:fixed;top:0;right:0;bottom:0;left:0;z-index:35;display:none;background:rgba(20,10,4,.82);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(var(--it) + 8px) calc(var(--ir) + 8px) calc(var(--ib) + 8px) calc(var(--il) + 8px);font-family:"Trebuchet MS",Verdana,sans-serif;color:#2b1a10}
#ca.on{display:block}
#ca *{-webkit-user-select:none;user-select:none}
#ca .capanel{position:relative;max-width:760px;margin:0 auto;background:radial-gradient(ellipse at 50% 30%,#fffaf0 0%,#f7e6bb 75%,#e8cf95 100%);border:5px solid #9a5a2a;border-radius:20px;box-shadow:0 0 0 3px #e8b84a,0 10px 30px rgba(0,0,0,.6);padding:16px 16px 14px}
#ca .caclose{position:absolute;right:8px;top:6px;width:44px;height:44px;border:2px solid #3a1d08;border-radius:14px;background:#c98a4e;color:#fff;font:900 26px/1 Verdana,sans-serif;cursor:pointer}
#ca .kick{font:900 11px "Trebuchet MS",Verdana,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#7a4a12}
#ca h2{margin:2px 0 6px;font:900 26px "Trebuchet MS",Verdana,sans-serif;color:#ffd34d;-webkit-text-stroke:1px #3a1d08;text-shadow:0 2px 0 #3a1d08}
#ca .canote{margin:0 0 10px;font-size:13px;line-height:1.35;color:#3a1d08}
#ca .catips{margin:8px 0;padding-left:22px;font-size:13px;line-height:1.4;color:#3a1d08}
#ca .cabtns .cabtn,#ca .cabtns>*{margin:0 8px 8px 0}#ca .cabtns{display:flex;flex-wrap:wrap;align-items:center}
#ca .cabtns.main{margin:6px 0 0}#ca .cabtns.foot{margin-top:12px;justify-content:space-between}
#ca .cabtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 16px;border:2px solid #3a1d08;border-radius:14px;background:linear-gradient(#fff3b0,#ffd451 30%,#f0a51f 75%,#c9761a);color:#4a2508;font:900 15px "Trebuchet MS",Verdana,sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 #6b3510;touch-action:manipulation;text-align:center}
#ca .cabtn.big{font-size:18px;padding:8px 22px}#ca .cabtn.sm{min-height:38px;padding:3px 12px;font-size:13px}
#ca .cabtn.ghost{background:#f1e2bd;box-shadow:0 3px 0 #b79a5d;color:#5a3a12}
#ca .cabtn.tog{background:linear-gradient(#d7d0c4,#9d9487);color:#fff;text-shadow:0 1px 0 #555}#ca .cabtn.tog.on{background:linear-gradient(#e6ffb8,#8fe05a 30%,#3fa83a 75%,#2a7d2c);text-shadow:0 2px 0 #1d5a1e}
#ca .cabtn:active{transform:translateY(2px)}
#ca .camsg{margin:8px 0;padding:0;font-size:14px;font-weight:bold;color:#3a1d08;white-space:pre-wrap}
#ca .camsg:empty{display:none}
#ca .camsg.good{color:#1d6a1e}#ca .camsg.bad{color:#9a1f11;background:#fff3f0;border:2px solid #9a1f11;border-radius:10px;padding:8px 12px}
#ca .capick{background:#fff;border:3px solid #c9922e;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}
#ca .capcv canvas{display:block;margin:8px auto;max-height:260px;max-width:100%;border:1px solid #888;background:#fff}
#ca .cagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
#ca .catile{background:#fffdf5;border:2px solid #d9b676;border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center}#ca .catile>*{margin-top:4px}
#ca .catile.has{border-color:#3fa83a;background:#f4ffe9}
#ca .catile small{font-size:11px;color:#6a5a42;line-height:1.2}
#ca .cath{width:100%;height:84px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#f3ead2 0 25%,#fffaf0 0 50%) 0 0/16px 16px;border-radius:8px}
#ca .cath img{max-width:100%;max-height:80px}#ca .cath img.orig{opacity:.75}
#ca .cath .none{font-size:11px;color:#8a7a62;padding:4px}
#ca .catile .cabtns{justify-content:center}#ca .catile .cabtns>*{margin:0 3px 0}
#ca .caspin{display:none;position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(255,250,235,.8);border-radius:16px;align-items:flex-start;justify-content:center;padding-top:120px;font:900 22px "Trebuchet MS",Verdana,sans-serif;color:#7a4220}
#ca.busy .caspin{display:flex}
#rotate .rotbtn{margin-top:18px;min-height:48px;padding:8px 20px;border:3px solid #3a1d08;border-radius:16px;background:linear-gradient(#fff3b0,#ffd451 30%,#f0a51f 75%,#c9761a);color:#4a2508;font:900 18px "Trebuchet MS",Verdana,sans-serif;cursor:pointer}
a.btn{text-decoration:none}
</style></head><body>
<canvas id="c"></canvas><div id="load">Loading…</div>
<div id="ui"></div>
<div id="top"><button class="btn cream" id="home" aria-label="Home">🏠</button><div id="mid" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center"><div id="hud"></div></div><span style="display:flex"><button class="btn cream" id="tiltb" aria-label="Tilt">📱</button><button class="btn cream" id="mute" aria-label="Sound">🔊</button></span></div>
<div id="cap"></div>
<div id="card"><div class="in"></div></div>
<div id="fade"></div>
<div id="rotate"><div class="ph"></div><div>Turn your phone sideways<br>to play! 🔄</div><div class="sub">The game is paused.</div><button class="rotbtn" id="rotArt">🎨 Class Art / Add colored page</button></div>
<div id="err"></div>
<script>
(function(){function show(m){try{var e=document.getElementById("err");e.style.display="block";e.textContent+=(e.textContent?"\n":"")+"Error: "+m}catch(x){}}
window.__showErr=show;addEventListener("error",function(ev){show((ev.message||"script error")+(ev.lineno?" (line "+ev.lineno+")":""))});
addEventListener("unhandledrejection",function(ev){show(ev.reason&&ev.reason.message||String(ev.reason))})})();
</script>
